<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <style>
    /* Light-scheme defaults for standalone rendering. `svg:root`
       matches only when this file is the document root, so an
       inlining page's own --diagram-* tokens take over and the
       scheme toggle reaches the artwork. */
    svg:root {
      --diagram-accent-fill: #eef2f8;
      --diagram-accent: #2f4d7a;
      --diagram-node-fill: #ffffff;
      --diagram-node-stroke: #c9cfd8;
      --diagram-node-label: #16191f;
      --diagram-body: #5a616b;
      --diagram-muted: #6b727c;
      --diagram-connector: #c9cfd8;
      --diagram-accent-connector: #2f4d7a;
      --diagram-deferred: #a8b0ba;
    }
  </style>
<defs>
  <marker id="head-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-muted)"/>
  </marker>
  <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-accent-connector)"/>
  </marker>
  <marker id="head-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-deferred)"/>
  </marker>
</defs>
<text x="60" y="52" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="25" fill="var(--diagram-node-label)" font-weight="700" text-anchor="start">The learning loop</text>
<text x="60" y="76" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="14.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">Memory is not a bigger prompt. It is the residue of finished work, curated on purpose and loaded on demand.</text>
<rect x="150" y="150" width="300" height="132" rx="8" fill="var(--diagram-accent-fill)" stroke="var(--diagram-accent)" stroke-width="1.8"/>
<text x="300.0" y="180" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16.5" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle">1 · session</text>
<text x="300.0" y="204" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">The crew works a task through the</text>
<text x="300.0" y="221" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">lifecycle. Triage decides which phases</text>
<text x="300.0" y="238" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">run at all.</text>
<text x="300.0" y="262" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-accent)" font-weight="400" text-anchor="middle">memory is read here, on demand</text>
<rect x="950" y="150" width="300" height="132" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/>
<text x="1100.0" y="180" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">2 · activity trail</text>
<text x="1100.0" y="204" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">A Stop hook records what actually</text>
<text x="1100.0" y="221" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">happened, locally, when the session</text>
<text x="1100.0" y="238" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">ends.</text>
<text x="1100.0" y="262" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-muted)" font-weight="400" text-anchor="middle">raw, uncurated</text>
<rect x="950" y="460" width="300" height="132" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/>
<text x="1100.0" y="490" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">3 · /harvest-memory</text>
<text x="1100.0" y="514" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· source precedence decides who wins</text>
<text x="1100.0" y="533" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· contradictions surface as decisions</text>
<text x="1100.0" y="552" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· a dedup ledger stops repetition</text>
<rect x="150" y="460" width="300" height="132" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/>
<text x="300.0" y="490" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">4 · memory/</text>
<text x="300.0" y="514" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· per-repo and per-project notes</text>
<text x="300.0" y="533" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· standing feedback · glossary</text>
<text x="300.0" y="552" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">· ships as structure, not content</text>
<path d="M 464 216.0 L 936 216.0" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<path d="M 1100.0 296 L 1100.0 446" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<path d="M 936 526.0 L 464 526.0" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<path d="M 300.0 446 L 300.0 296" fill="none" stroke="var(--diagram-accent-connector)" stroke-width="1.4" marker-end="url(#head-accent)"/>
<text x="700.0" y="204.0" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-muted)" font-weight="400" text-anchor="middle">session ends</text>
<text x="1114.0" y="371.0" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-muted)" font-weight="400" text-anchor="start">you curate, deliberately</text>
<text x="700.0" y="514.0" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-muted)" font-weight="400" text-anchor="middle">durable notes written</text>
<text x="286.0" y="371.0" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-accent)" font-weight="400" text-anchor="end">loaded on demand</text>
<path d="M 510 582 L 580 672" fill="none" stroke="var(--diagram-deferred)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head-future)"/>
<rect x="590" y="652" width="420" height="74" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-deferred)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="800" y="680" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="var(--diagram-deferred)" font-weight="700" text-anchor="middle">readiness.md → autonomy dial</text>
<text x="800" y="702" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="middle">per-repo session outcomes. Planned, not shipped.</text>
</svg>