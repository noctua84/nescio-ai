<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="834" viewBox="0 0 1000 834">
  <style>
    /* Light-scheme defaults for standalone rendering. `svg:root`
       matches only when this file is the document root, so an
       inlining page's own --diagram-* tokens take over and the
       scheme toggle reaches the artwork. */
    svg:root {
      --diagram-accent-fill: #eef2f8;
      --diagram-accent: #2f4d7a;
      --diagram-node-fill: #ffffff;
      --diagram-node-stroke: #c9cfd8;
      --diagram-node-label: #16191f;
      --diagram-body: #5a616b;
      --diagram-muted: #6b727c;
      --diagram-connector: #c9cfd8;
      --diagram-accent-connector: #2f4d7a;
      --diagram-deferred: #a8b0ba;
    }
  </style>
<defs>
  <marker id="head-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-muted)"/>
  </marker>
  <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-accent-connector)"/>
  </marker>
  <marker id="head-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--diagram-deferred)"/>
  </marker>
</defs>
<text x="60" y="52" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="25" fill="var(--diagram-node-label)" font-weight="700" text-anchor="start">The crew</text>
<text x="60" y="76" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="14.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">One orchestrator, nine specialists. Delegation goes down; every result comes back through the gate.</text>
<rect x="410.0" y="108" width="180" height="40" rx="20" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/>
<text x="500.0" y="133" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="14.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">your request</text>
<path d="M 500.0 148 L 500.0 176" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<rect x="265.0" y="178" width="470" height="84" rx="8" fill="var(--diagram-accent-fill)" stroke="var(--diagram-accent)" stroke-width="1.8"/>
<text x="500.0" y="208" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle">orchestrator</text>
<text x="500.0" y="231" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">coordinates the lifecycle · never writes production code</text>
<text x="500.0" y="250" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-muted)" font-weight="400" text-anchor="middle">triage → discover → analyze → plan → execute → verify → deliver</text>
<rect x="70.0" y="300" width="860" height="52" rx="10" fill="var(--diagram-node-fill)" stroke="var(--diagram-accent)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="500.0" y="322" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle" letter-spacing="1.4">ROUTING QUALITY GATE</text>
<text x="500.0" y="340" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">judge a result before relaying it — never launder a low-trust answer</text>
<path d="M 350.0 262 L 350.0 294" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<path d="M 350.0 358 L 350.0 404" fill="none" stroke="var(--diagram-connector)" stroke-width="1.4" marker-end="url(#head-end)"/>
<text x="332.0" y="286" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="end">delegate</text>
<path d="M 650.0 404 L 650.0 358" fill="none" stroke="var(--diagram-accent-connector)" stroke-width="1.4" marker-end="url(#head-accent)"/>
<path d="M 650.0 294 L 650.0 262" fill="none" stroke="var(--diagram-accent-connector)" stroke-width="1.4" marker-end="url(#head-accent)"/>
<text x="668.0" y="286" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--diagram-accent)" font-weight="400" text-anchor="start">results</text>
<text x="176.0" y="420" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--diagram-muted)" font-weight="700" text-anchor="middle" letter-spacing="1.3">TRIAGE &amp; DISCOVERY</text>
<line x1="36.0" y1="428" x2="316.0" y2="428" stroke="var(--diagram-node-stroke)" stroke-width="1"/>
<rect x="36.0" y="448" width="280" height="82" rx="8" fill="var(--diagram-accent-fill)" stroke="var(--diagram-accent)" stroke-width="1.2"/><text x="176.0" y="474" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle">scout</text><text x="176.0" y="494" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">risk and intent triage; surfaces hidden</text><text x="176.0" y="511" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">assumptions</text>
<rect x="36.0" y="542" width="280" height="65" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="176.0" y="568" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">explore</text><text x="176.0" y="588" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">fast navigation of the codebase</text>
<rect x="36.0" y="619" width="280" height="82" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="176.0" y="645" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">librarian</text><text x="176.0" y="665" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">external research, returned with</text><text x="176.0" y="682" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">citations</text>
<rect x="36.0" y="713" width="280" height="65" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="176.0" y="739" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">vision</text><text x="176.0" y="759" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">diagrams, PDFs and images</text>
<text x="500.0" y="420" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--diagram-muted)" font-weight="700" text-anchor="middle" letter-spacing="1.3">PLAN &amp; CHALLENGE</text>
<line x1="360.0" y1="428" x2="640.0" y2="428" stroke="var(--diagram-node-stroke)" stroke-width="1"/>
<rect x="360.0" y="448" width="280" height="65" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="500.0" y="474" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">planner</text><text x="500.0" y="494" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">requirement interview, work plan</text>
<rect x="360.0" y="525" width="280" height="82" rx="8" fill="var(--diagram-accent-fill)" stroke="var(--diagram-accent)" stroke-width="1.2"/><text x="500.0" y="551" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle">validator</text><text x="500.0" y="571" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">is the plan executable? biased toward</text><text x="500.0" y="588" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">approval</text>
<rect x="360.0" y="619" width="280" height="82" rx="8" fill="var(--diagram-accent-fill)" stroke="var(--diagram-accent)" stroke-width="1.2"/><text x="500.0" y="645" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-accent)" font-weight="700" text-anchor="middle">critic</text><text x="500.0" y="665" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">devil's advocate, one bounded pass,</text><text x="500.0" y="682" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">pre-execution</text>
<rect x="360.0" y="713" width="280" height="65" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="500.0" y="739" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">advisor</text><text x="500.0" y="759" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">read-only guidance on tradeoffs</text>
<text x="824.0" y="420" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--diagram-muted)" font-weight="700" text-anchor="middle" letter-spacing="1.3">VERIFY</text>
<line x1="684.0" y1="428" x2="964.0" y2="428" stroke="var(--diagram-node-stroke)" stroke-width="1"/>
<rect x="684.0" y="448" width="280" height="65" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2"/><text x="824.0" y="474" font-family="'Nescio Mono', 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="middle">reviewer</text><text x="824.0" y="494" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="middle">audits for bugs, regressions, security</text>
<rect x="684.0" y="532" width="280" height="254" rx="8" fill="var(--diagram-node-fill)" stroke="var(--diagram-node-stroke)" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="704.0" y="562" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="var(--diagram-node-label)" font-weight="700" text-anchor="start">Why three are highlighted</text>
<text x="704.0" y="586" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">scout, validator and critic produce no</text>
<text x="704.0" y="604" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">work of their own. They exist to</text>
<text x="704.0" y="622" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">interrogate the request and the plan</text>
<text x="704.0" y="640" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">before anyone acts on either — the</text>
<text x="704.0" y="658" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">same ratio any functioning team spends</text>
<text x="704.0" y="676" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-body)" font-weight="400" text-anchor="start">on design review and QA.</text>
<text x="704.0" y="708" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="start">Neither is a blocker by disposition:</text>
<text x="704.0" y="726" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="start">the critic may conclude the plan</text>
<text x="704.0" y="744" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="start">holds, and the validator approves when</text>
<text x="704.0" y="762" font-family="'Nescio Sans', Carlito, Calibri, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--diagram-muted)" font-weight="400" text-anchor="start">in doubt.</text>
</svg>