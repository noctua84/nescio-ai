name: module-gate

# PR-only: on `push` there is no PR body to pass as --ack-file, and the
# symmetric-difference base (`origin/main...HEAD`) is meaningless outside a
# PR's own diff.
#
# `types` is spelled out because the remedy this gate prescribes is "add a
# Module-check: line to the PR body", and the default set --
# opened/synchronize/reopened -- does not include `edited`. Without it the gate
# tells you to edit the body, the edit does not re-run the gate, and the check
# stays red while the fix is already in place. Re-running is not a way out
# either: the body is read from `github.event.pull_request.body`, which is an
# event-payload snapshot, so `gh run rerun` replays the stale body and fails
# again. Naming `types` REPLACES the default set, so all four are listed rather
# than only the one being added.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least privilege: these jobs only check out and read the repo. Declared
# explicitly so a change to the repo/org default token permissions can't
# silently widen them. Jobs needing more declare their own block.
permissions:
  contents: read

jobs:
  module-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone has no merge base, so `git diff
          # <base>...<head>` can't find the symmetric difference and the gate
          # would fail to run at all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The PR body is untrusted text. Write it to a file via an env var
      # rather than interpolating `${{ github.event.pull_request.body }}`
      # directly into a `run:` block, which would be a shell-injection vector.
      - name: Collect PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      # --base is omitted deliberately: GitHub Actions sets GITHUB_BASE_REF to
      # the PR's base branch name on every pull_request run, and module_gate.py
      # resolves that to origin/$GITHUB_BASE_REF on its own when --base isn't
      # passed. Excludes below are long-form prose records, not modules --
      # growing them is not the thing this gate is watching for.
      #
      # `memory/*.md` is the brain's notes and ADRs. ADR 0005 crossed the
      # tripwire at 448 lines on #181 and the gate demanded a module verdict for
      # it, but the three tests the banner points at are meaningless for prose:
      # an ADR has no reasons-to-change in that sense, no shared mutable state
      # and nothing to name. The only verdict available was a true-sounding
      # sentence written to clear a gate, which is the exact failure ADR 0006
      # exists to prevent. Scoped to `*.md` on purpose, so a `.py` that ever
      # lands under memory/ is still gated.
      #
      # `docs/reports/*.md` is the same category: dated, append-only QA and
      # audit records, every one of them already several times the tripwire. Any
      # edit to one -- down to a single-word correction -- used to demand a
      # module verdict for a document with no module shape to describe. It was
      # reached the same way ADR 0005 reached it: a prose-only privacy fix had
      # to carry two verdicts it could not honestly write.
      #
      # Both patterns are a single `*`, not `**`, and that is load-bearing.
      # `module_scan.is_excluded` matches with `fnmatch`, whose `*` already
      # crosses `/` -- so `memory/*.md` covers `memory/repo/.../0005-x.md` AND
      # `memory/CONVENTIONS.md`, while `memory/**/*.md` translates to a pattern
      # that requires a literal `/` after the wildcard and therefore silently
      # misses every `.md` sitting directly in the directory. That is what the
      # `memory/**/*.md` spelling here did: `memory/CONVENTIONS.md` was still
      # gated, latent only because it is 126 lines. The first attempt at the
      # `docs/reports` line was spelled `**/*.md` too and excluded none of the
      # four real reports. `tests/test_module_gate_excludes.py` pins the actual
      # tree against these patterns so the next such typo fails a test instead
      # of quietly doing nothing.
      - run: |
          python scripts/module_gate.py \
            --head HEAD \
            --ack-file /tmp/pr-body.txt \
            --exclude 'docs/plans/**' \
            --exclude 'docs/specs/**' \
            --exclude 'docs/reports/*.md' \
            --exclude '.sisyphus/**' \
            --exclude 'memory/*.md' \
            --exclude 'CHANGELOG.md' \
            --exclude 'docs/usage/data.json'
