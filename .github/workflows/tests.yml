# .github/workflows/tests.yml
name: tests

# The `schedule` and `workflow_dispatch` triggers exist for the `roadmap` job
# below -- it is the only job that needs them. `tests` and `lockfile` will fire
# on the weekly cron too; that is accepted rather than worked around. They are
# cheap, and a weekly independent confirmation that the suite still passes
# against a fresh runner image is a feature, not noise. Deliberately NOT done:
# narrowing `push:` to `branches: [main]`, which would silently change when
# `tests` and `lockfile` run. The main-only condition lives on the one job that
# wants it, as a job-level `if:`.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday; offset minute avoids the top-of-hour queue
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      # `docs_site/docs/agents.md` and `docs_site/docs/skills.md` are generated
      # *and* tracked -- rendered by docs_site/gen_catalog.py out of the YAML
      # frontmatter of agents/*.md and skills/*/SKILL.md. Nothing forces the
      # generator to be rerun when a definition changes, so a PR that adds an
      # agent leaves the committed catalog describing the previous crew. That is
      # not hypothetical: PR #90 added six agents without regenerating, and the
      # page went on announcing "Nescio ships 11 agent definitions" while
      # `agents/` held 17. This step is what turns that silent drift into a loud
      # failure.
      #
      # Nothing else catches it. The `unittest discover -s tests` step above
      # never reaches `docs_site/`, which is a separate suite root outside that
      # discovery path. And the `mkdocs build --strict` in docs.yml renders
      # whatever markdown is on disk -- neither hook wired in
      # docs_site/mkdocs.yml (hooks/assets.py, hooks/inline_svg.py) imports
      # gen_catalog, so a stale page builds perfectly happily.
      #
      # TRADE-OFF, recorded on purpose: this duplicates an assertion that
      # already exists -- test_committed_pages_are_up_to_date, in
      # docs_site/test_gen_catalog.py (TestAgainstTheRealRepo). That test is not
      # wrong; it simply never runs in CI, which is why it went red on `main`
      # when #90 landed and then sat red there, unnoticed, ever since. The
      # alternative considered was a second `unittest discover -s docs_site`
      # run, which would pick that test up along with the other 67 in
      # `docs_site/` (test_site_content.py included). Rejected here as wider
      # than the failure mode being fixed: a site-content failure would then red
      # the `tests` job for a reason unrelated to catalog drift. The narrow step
      # instead fails with a precise error naming the stale file. Widening to
      # the full docs_site suite stays a reasonable future move -- it should
      # just be a deliberate one, not a side effect of this guard.
      - run: python docs_site/gen_catalog.py --check

  # `uv.lock` records the project's own version, so it drifts from pyproject.toml
  # on every release. release-please keeps it in step via `extra-files` in
  # release-please-config.json; this job is the tripwire that proves that entry
  # still works. If the project name in pyproject.toml ever changes, the
  # extra-files jsonpath stops matching and silently no-ops -- this check is what
  # turns that silent drift into a loud failure.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv lock --check

  # `ROADMAP.md` duplicates state GitHub owns -- which issues are open, and which
  # milestone each belongs to -- with nothing detecting divergence. It drifted
  # three times over 68 commits: two issues closed but still listed, seven open
  # issues never added (#60). Nothing in the repository fails when that happens,
  # because the drift is caused by issue open/close events on GitHub's side, not
  # by any commit. This job is what turns that silent drift into a loud failure.
  #
  # The offline half of the same check -- the parse, the shape and the
  # duplicate-reference checks, which ARE diff-caused -- already runs on every
  # push and pull request inside the `tests` job, via tests/test_roadmap_drift.py.
  # This job adds only the half that needs the network.
  #
  # TRIGGERS: push-to-main, the weekly cron, and manual dispatch -- NOT
  # `pull_request`. The drift this catches comes from issue open/close events,
  # which produce no PR at all, so a PR run would catch none of it while
  # inheriting all of its false positives. This repo's PRs close issues
  # out-of-band (#89, #91, #93 and #94 use no closing keywords), so every such
  # close would otherwise red the next unrelated PR. The cron is the only trigger
  # that fires on an issue event with no push behind it, and is therefore the
  # highest-value one here.
  #
  # PRECONDITION: this job must NOT be added to main's required status checks.
  # Protection currently requires only ["tests"]. This job exits 2 ("could not
  # check") on a `gh` outage or a rate limit and that is deliberate -- a check
  # that silently disables itself is exactly the defect #60 was filed about -- but
  # it is only safe while a red here does not block merges. If you make it
  # required, change the exit-2 handling first. Do not do both.
  #
  # NOTE: GitHub auto-disables cron workflows after 60 days of repository
  # inactivity. If the weekly run stops appearing, that is why, and
  # `workflow_dispatch` is how it gets re-armed.
  roadmap:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Read-only, and no more. This job never opens a PR or applies a label; it
    # only reports. The script's narrow `--jq` projection is the privacy control
    # that goes with `issues: read`: it pulls number, milestone title and label
    # names and nothing else. This repo is public and so are its CI logs --
    # widening that projection would dump every open issue body into one.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Exit 1 (drift) and exit 2 (could not check) both fail this job on
      # purpose. Do not soften either with an error-swallowing step option --
      # a check that goes quiet is the defect, not the cure.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/check_roadmap_drift.py
