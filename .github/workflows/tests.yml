# .github/workflows/tests.yml
name: tests

# The `schedule` and `workflow_dispatch` triggers exist for the two jobs that
# want them, `docs-tests` and `roadmap` below. `tests` and `lockfile` will fire
# on the weekly cron too; that is accepted rather than worked around. They are
# cheap, and a weekly independent confirmation that the suite still passes
# against a fresh runner image is a feature, not noise. Deliberately NOT done:
# narrowing `push:` to `branches: [main]`, which would silently change when
# `tests` and `lockfile` run. The main-only condition lives on each job that
# wants it, as a job-level `if:` -- `docs-tests` and `roadmap` carry the same
# expression, and they are the only jobs that carry one at all.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday; offset minute avoids the top-of-hour queue
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -v

  # The docs_site/ tests are a second unittest root, and brand/ is a third --
  # this job runs both. `discover -s tests` above reaches neither, by design:
  # `tests/` is on FRAMEWORK_PATHS and syncs into derived instances, which never
  # receive `docs_site/` or `brand/`, so a test there importing gen_catalog would
  # break `python -m unittest` for every downstream user. Discovering the other
  # roots in a second job is the way that boundary stays intact and the tests
  # still run.
  #
  # WHAT THIS JOB IS: a maintainer-facing drift detector for the docs site, in
  # the same family as `roadmap` below -- not a verdict on the change under
  # review. What it covers, and nothing else in this repository does: the
  # catalog generator against the committed pages (the strict roster equality
  # assertion included), the crew and loop diagrams against their sources in
  # brand/, the homepage and 404 copy, MaterialPinTest, CrewRosterTest, and the
  # end-to-end BuiltSiteTest cases that shell out to a real
  # `mkdocs build --strict` and then assert what landed in site/.
  #
  # TRIGGERS: push-to-main, the weekly cron, and manual dispatch -- NOT
  # `pull_request`, for the same reason `roadmap` gives below: a PR run would
  # catch almost none of this drift while inheriting all of its false positives.
  # Docs drift is produced by a merge, not by the diff under review -- an agent
  # added on one branch goes missing from a catalog regenerated on another, so
  # the commit that made the site stale is usually not the commit being
  # reviewed, and a post-merge run sees every case a PR run would have seen and
  # then some. What a PR run WOULD reliably find is a contributor who added an
  # agent and did not touch docs_site/ -- precisely the case this branch removed
  # from the required `tests` job on purpose (see below). Non-required means it
  # could not block them; it would still red their PR, and a red X everybody
  # learns to scroll past is worse than no check at all. That is how the defect
  # survived in the first place:
  # docs_site/test_gen_catalog.py::test_committed_pages_are_up_to_date existed
  # the whole time and no trigger was asking it.
  #
  # CATALOG DRIFT IS DELIBERATELY NOT A MERGE GATE, and this is the job that
  # holds the guarantee instead. An earlier revision of this file ran
  # `python docs_site/gen_catalog.py --check` as a step in the required `tests`
  # job above; it was removed on purpose. The docs site is presentation -- it is
  # not needed to run the framework -- and making catalog drift block a merge
  # taxes every outside contribution with a subsystem the contributor does not
  # care about: adding an agent would force them to also pick a bucket in
  # `AGENT_GROUPS` (an editorial judgement, not a mechanical step) and commit a
  # regenerated artefact, or be blocked. That produces worse documentation, not
  # better. The site self-heals instead -- .github/workflows/docs.yml
  # regenerates the pages before `mkdocs build`, so an unrouted agent shows up
  # under "Other" on a site that still deploys rather than taking the deploy
  # down. The strict promise (`AGENT_GROUPS` routes exactly `agents/*.md`, both
  # directions) lives in docs_site/test_gen_catalog.py and runs here, where
  # maintainers see it and contributors are not gated by it.
  #
  # THE TRADE THIS ACCEPTS: a docs regression is caught after the merge that
  # caused it rather than before. Affordable, because the site is presentation
  # and the deploy does not depend on what was committed --
  # .github/workflows/docs.yml regenerates the catalog before it builds, so the
  # published site self-heals either way. What is at stake here is the committed
  # sources agreeing with the generator, which is a maintenance concern with no
  # deadline, not a broken deploy. A red on main names the merge that did it.
  #
  # "MAKE THIS REQUIRED" IS NOW STRUCTURALLY IMPOSSIBLE, not merely discouraged.
  # A required status check is resolved against a pull request's head commit,
  # and a job that never runs on `pull_request` reports no status there at all;
  # adding `docs-tests` to main's protection would leave every PR waiting
  # forever on a check that cannot arrive. The trigger enforces what the old
  # version of this comment could only ask for. Anyone who wants this as a merge
  # gate has to restore `pull_request` first -- and then two things become
  # mandatory in the same change, because this job installs from PyPI for the
  # BuiltSiteTest cases: pin or vendor the install, and delete the install
  # tolerance described immediately below. A required check that greens itself
  # when its install fails converts somebody else's outage into a gate that
  # certifies nothing while looking like it certified everything.
  #
  # INSTALL FAILURES ARE TOLERATED, BUT ANNOUNCED. The install step carries
  # `continue-on-error`; neither test step does. That split is the whole design.
  # A PyPI blip is not a defect in this repository, and a job nobody can retry
  # cheaply -- non-required, so a re-run means a maintainer noticing a red X on
  # a main or cron run and deciding it is worth the click -- should not
  # manufacture red history out of somebody else's CDN. A genuine test failure
  # still reds the job, because both steps that run a suite fail hard. The retry
  # and timeout flags come first: a transient failure should self-heal before it
  # is tolerated at all, so tolerance only ever applies to something that
  # survived five attempts.
  #
  # THE DEPENDENCY SPLIT LIVES INSIDE THE TEST MODULE, NOT ON THE STEPS, so the
  # tolerance reaches as little as possible. NEITHER test step carries an `if:`
  # -- both run whatever the install did. test_gen_catalog.py imports stdlib
  # plus gen_catalog, which is itself stdlib-only. test_site_content.py is
  # stdlib plus gen_catalog at module level too; the one class that needs
  # Material, BuiltSiteTest, imports mkdocs inside its own setUpClass and raises
  # unittest.SkipTest when that import fails. So a broken install costs exactly
  # that class: MaterialPinTest, CrewRosterTest, DiagramSourcesTest,
  # DiagramLayoutTest, DiagramModalTest, HeroTest and OverridesTest all still
  # run, and all still fail hard.
  #
  # It was not always so. test_site_content.py used to sit behind
  # `if: steps.install.outcome == 'success'`, which meant a PyPI outage skipped
  # the entire module -- CrewRosterTest, which pins the catalog's roster against
  # brand/make_diagrams.py, and MaterialPinTest, which guards the two-workflow
  # version pin, included. Neither has anything to do with Material being
  # downloadable. Dropping that `if:` left the gate exactly where the dependency
  # actually is, one class deep, instead of a whole file wide.
  #
  # Each of the two docs_site steps names its module with `-p` instead of
  # discovering the directory, so test_gen_catalog.py runs exactly once; a bare
  # `discover -s docs_site` in the second of them would re-run every one of its
  # cases. Those two `-p` patterns must therefore cover docs_site/ between them
  # -- every module a plain `discover -s docs_site` collects needs a step here.
  # Add a further test module to docs_site/ without adding a step and it runs in
  # neither. The rule is about the docs_site steps and only those: the `brand`
  # step is a separate discovery root and no `-p` pattern here reaches it.
  #
  # No test counts are quoted anywhere in this comment, deliberately. Nothing in
  # CI asserts them, so they rot silently on the next test added --
  # docs_site/test_gen_catalog.py::test_no_hardcoded_counts_in_the_generator
  # holds gen_catalog.py to precisely that rule, and this file should not be
  # exempt from it. Describe the split by dependency; the runner prints the
  # numbers.
  #
  # Not `continue-on-error` on the JOB. That would green real test failures too
  # and leave a check that reports nothing -- which is the defect the `roadmap`
  # job's comment below refuses by name, and the reason this job exists at all
  # is that docs_site/'s tests finally execute somewhere.
  #
  # RESIDUAL RISK, stated plainly, and now as small as this design can make it:
  # a *persistent* install failure -- a yanked release, a rename, a pin that no
  # longer resolves -- means BuiltSiteTest skips itself while the job keeps
  # reporting green. What that costs is the only end-to-end coverage there is: a
  # real `mkdocs build --strict` against the real config and hooks, plus the
  # assertions about what actually landed in site/ -- diagrams inlined as
  # `<svg>`, the modal script shipped and referenced, 404 at the site root, the
  # footer on every page, no external request anywhere in the build, the faces
  # self-hosted. A build that breaks without Material's help is exactly the
  # class of failure nothing else here can see.
  #
  # That risk is smaller than it was, and the trigger change is why. A
  # *persistent* breakage is the one a per-PR green hid best: the same skip
  # recurring on every PR reads as normal, and nobody re-runs a job that is
  # always like that. On a weekly cron there is no traffic to hide in -- the
  # Monday run is the only signal, so a skip that is still there next Monday is
  # a standing, dated record that the site has not been built in a week. The
  # residual risk was listed here as unfixed; the `schedule` trigger closes the
  # persistent half of it. The transient half stays: one bad Monday still looks
  # like a green job with a warning nobody read.
  #
  # What is NOT exposed any more is everything provable by reading the sources:
  # test_gen_catalog.py in full, the strict roster assertion included, and every
  # other class in test_site_content.py -- CrewRosterTest and MaterialPinTest
  # among them. Those run whatever the install did, which is the point of the
  # split above.
  #
  # A skip is not a pass, and the job's green tick cannot tell them apart. The
  # warning annotation and the step-summary line are the only things standing
  # between that skip and nobody noticing, so they are load-bearing, not
  # decoration. If you find yourself trimming CI noise, that annotation is not
  # noise. If you see it on a main or cron run, the site was never built on that
  # commit.
  docs-tests:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # brand/ IS THE THIRD UNITTEST ROOT, AND UNTIL THIS STEP IT RAN NOWHERE.
      # `discover -s tests` does not reach it and nothing else asked for it, so
      # the design system's own suite sat in the repository green on a laptop and
      # never once executed by CI -- the same shape of defect as
      # test_committed_pages_are_up_to_date, which existed the whole time with no
      # trigger behind it.
      #
      # WHY THIS JOB AND NOT THE REQUIRED `tests` JOB ABOVE: it is the same
      # presentation-versus-framework line the "CATALOG DRIFT IS DELIBERATELY NOT
      # A MERGE GATE" paragraph draws, applied to the subsystem that draws the
      # site. brand/ is the docs site's design system. Every consumer of it lives
      # in docs_site/ -- hooks/assets.py, hooks/inline_svg.py, gen_catalog.py,
      # test_site_content.py -- and nothing in scripts/ or agents/ imports it. It
      # is deliberately NOT on FRAMEWORK_PATHS, so a derived downstream instance
      # never receives brand/ at all. Making it a merge gate would gate a
      # contributor on a subsystem their install does not contain.
      #
      # NO `if:`, AND ABOVE THE INSTALL ON PURPOSE. brand/ is stdlib-only, so it
      # wants nothing the step below downloads -- and standing here, before
      # anything is installed, is what makes that structurally obvious instead of
      # merely asserted in a comment. It runs whatever the `continue-on-error`
      # install did, which is the rule the dependency-split paragraph above
      # states: THE DEPENDENCY SPLIT LIVES INSIDE THE TEST MODULE, NOT ON THE
      # STEPS.
      #
      # This step discovers a directory (`-s brand`) rather than naming a module
      # with `-p`, unlike the two docs_site steps below it, and that is safe here
      # precisely because brand/ is a separate discovery root: nothing it collects
      # is reachable by a `-s docs_site` pattern, so there is no double-run to
      # avoid and no pattern roster to keep in step. Add a test module to brand/
      # and it runs. That is the whole of the difference.
      #
      # brand/test_favicons.py::TestNoTruncatedRender SELF-SKIPS WHEN PILLOW IS
      # ABSENT, AND THAT IS THE INTENDED STATE. Do not "fix" it by installing
      # Pillow here. Pillow is not a repository dependency and the rasterisers are
      # local-only by design -- brand/render_diagrams.py says so in as many words,
      # "LOCAL-ONLY -- deliberately not run in CI". This repository is stdlib-only
      # on purpose, and a step that installs nothing is what holds it to that. The
      # skip is the documented consequence of the policy, not a gap in coverage
      # waiting to be closed.
      - run: python -m unittest discover -s brand -v
      # Same hard pin as .github/workflows/docs.yml, and for the same reason:
      # the custom schemes are coupled to Material's CSS variable names. Keep
      # the two in step.
      - id: install
        continue-on-error: true
        run: pip install --retries 5 --timeout 30 mkdocs-material==9.7.7
      # NO `if:` HERE, DELIBERATELY. test_gen_catalog.py imports stdlib plus
      # gen_catalog, which is itself stdlib-only -- it does not care whether the
      # step above worked. It holds the strict roster guarantee and nothing else
      # does, so it must not be reachable by a PyPI outage.
      - run: python -m unittest discover -s docs_site -p "test_gen_catalog.py" -v
      # `outcome` is the step's result BEFORE continue-on-error rewrites it;
      # `conclusion` would read `success` here no matter what happened, which is
      # exactly the silent-green failure mode being guarded against.
      - if: steps.install.outcome != 'success'
        run: |
          echo "::warning title=docs_site site was never built on this commit::Installing the pinned mkdocs-material failed after 5 retries, so BuiltSiteTest skipped itself -- no real 'mkdocs build --strict' ran and nothing checked what shipped into site/. Every other docs_site test did run and pass: test_gen_catalog.py in full, and the rest of test_site_content.py including MaterialPinTest and CrewRosterTest. Re-run the job once PyPI is reachable."
          {
            echo "### :warning: \`docs-tests\`: the site was never built"
            echo
            echo "Installing the pinned \`mkdocs-material\` failed after 5 retries, so"
            echo "\`BuiltSiteTest\` **skipped itself**: no real \`mkdocs build --strict\`"
            echo "ran on this commit, and nothing checked what shipped into \`site/\`."
            echo
            echo "Everything else ran and passed -- \`test_gen_catalog.py\` in full, and"
            echo "every other class in \`test_site_content.py\`, \`MaterialPinTest\` and"
            echo "\`CrewRosterTest\` included. This job is green for the end-to-end half"
            echo "because the install broke, not because those cases passed."
          } >> "$GITHUB_STEP_SUMMARY"
      # NO `if:` HERE EITHER, DELIBERATELY -- see the dependency-split comment
      # above. Only BuiltSiteTest needs Material, and it self-skips on
      # ImportError; gating the whole module on the install would take
      # MaterialPinTest and CrewRosterTest down with a PyPI outage.
      - run: python -m unittest discover -s docs_site -p "test_site_content.py" -v

  # `uv.lock` records the project's own version, so it drifts from pyproject.toml
  # on every release. release-please keeps it in step via `extra-files` in
  # release-please-config.json; this job is the tripwire that proves that entry
  # still works. If the project name in pyproject.toml ever changes, the
  # extra-files jsonpath stops matching and silently no-ops -- this check is what
  # turns that silent drift into a loud failure.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv lock --check

  # `ROADMAP.md` duplicates state GitHub owns -- which issues are open, and which
  # milestone each belongs to -- with nothing detecting divergence. It drifted
  # three times over 68 commits: two issues closed but still listed, seven open
  # issues never added (#60). Nothing in the repository fails when that happens,
  # because the drift is caused by issue open/close events on GitHub's side, not
  # by any commit. This job is what turns that silent drift into a loud failure.
  #
  # The offline half of the same check -- the parse, the shape and the
  # duplicate-reference checks, which ARE diff-caused -- already runs on every
  # push and pull request inside the `tests` job, via tests/test_roadmap_drift.py.
  # This job adds only the half that needs the network.
  #
  # TRIGGERS: push-to-main, the weekly cron, and manual dispatch -- NOT
  # `pull_request`. The drift this catches comes from issue open/close events,
  # which produce no PR at all, so a PR run would catch none of it while
  # inheriting all of its false positives. This repo's PRs close issues
  # out-of-band (#89, #91, #93 and #94 use no closing keywords), so every such
  # close would otherwise red the next unrelated PR. The cron is the only trigger
  # that fires on an issue event with no push behind it, and is therefore the
  # highest-value one here.
  #
  # PRECONDITION: this job must NOT be added to main's required status checks.
  # Protection currently requires only ["tests"]. This job exits 2 ("could not
  # check") on a `gh` outage or a rate limit and that is deliberate -- a check
  # that silently disables itself is exactly the defect #60 was filed about -- but
  # it is only safe while a red here does not block merges. If you make it
  # required, change the exit-2 handling first. Do not do both.
  #
  # NOTE: GitHub auto-disables cron workflows after 60 days of repository
  # inactivity. If the weekly run stops appearing, that is why, and
  # `workflow_dispatch` is how it gets re-armed.
  roadmap:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Read-only, and no more. This job never opens a PR or applies a label; it
    # only reports. The script's narrow `--jq` projection is the privacy control
    # that goes with `issues: read`: it pulls number, milestone title and label
    # names and nothing else. This repo is public and so are its CI logs --
    # widening that projection would dump every open issue body into one.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Exit 1 (drift) and exit 2 (could not check) both fail this job on
      # purpose. Do not soften either with an error-swallowing step option --
      # a check that goes quiet is the defect, not the cure.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/check_roadmap_drift.py
