# .github/workflows/tests.yml
name: tests

# The `schedule` and `workflow_dispatch` triggers exist for the `roadmap` job
# below -- it is the only job that needs them. `tests` and `lockfile` will fire
# on the weekly cron too; that is accepted rather than worked around. They are
# cheap, and a weekly independent confirmation that the suite still passes
# against a fresh runner image is a feature, not noise. Deliberately NOT done:
# narrowing `push:` to `branches: [main]`, which would silently change when
# `tests` and `lockfile` run. The main-only condition lives on the one job that
# wants it, as a job-level `if:`.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday; offset minute avoids the top-of-hour queue
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -v

  # The docs_site/ tests are a second unittest root. `discover -s tests` above
  # does not reach them, by design: `tests/` is on FRAMEWORK_PATHS and syncs
  # into derived instances, which never receive `docs_site/`, so a test there
  # importing gen_catalog would break `python -m unittest` for every downstream
  # user. Discovering the second root in a second job is the way that boundary
  # stays intact and the tests still run. What runs here and nowhere else: the
  # catalog roster equality assertion, MaterialPinTest, CrewRosterTest, and the
  # 8 end-to-end BuiltSiteTest cases.
  #
  # CATALOG DRIFT IS DELIBERATELY NOT A MERGE GATE, and this is the job that
  # holds the guarantee instead. An earlier revision of this file ran
  # `python docs_site/gen_catalog.py --check` as a step in the required `tests`
  # job above; it was removed on purpose. The docs site is presentation -- it is
  # not needed to run the framework -- and making catalog drift block a merge
  # taxes every outside contribution with a subsystem the contributor does not
  # care about: adding an agent would force them to also pick a bucket in
  # `AGENT_GROUPS` (an editorial judgement, not a mechanical step) and commit a
  # regenerated artefact, or be blocked. That produces worse documentation, not
  # better. The site self-heals instead -- .github/workflows/docs.yml
  # regenerates the pages before `mkdocs build`, so an unrouted agent shows up
  # under "Other" on a site that still deploys rather than taking the deploy
  # down. The strict promise (`AGENT_GROUPS` routes exactly `agents/*.md`, both
  # directions) lives in docs_site/test_gen_catalog.py and runs here, where
  # maintainers see it and contributors are not gated by it.
  #
  # PRECONDITION: this job must NOT be added to main's required status checks,
  # for the opposite reason to the `roadmap` job below. It installs from PyPI --
  # mkdocs-material is needed by the 8 end-to-end BuiltSiteTest cases, which
  # shell out to a real `mkdocs build --strict` -- and a network install inside
  # the blocking gate means a PyPI blip reds every open PR. Nothing about the
  # catalog needs to block a merge (see above), so nothing is lost by leaving
  # this job advisory.
  #
  # Making this job required is a branch-protection change in GitHub settings.
  # No commit in this repository can perform it, so if you want it, do it there
  # -- and pin or vendor the install first, and delete the install tolerance
  # described immediately below. The two are a package deal.
  #
  # INSTALL FAILURES ARE TOLERATED, BUT ANNOUNCED. The install step carries
  # `continue-on-error`; neither test step does. That split is the whole design.
  # A PyPI blip is not a defect in this repository, and a job nobody can retry
  # cheaply -- non-required, so a re-run means a human noticing a red X on a PR
  # that is otherwise fine and deciding it is worth the click -- should not
  # manufacture red PRs out of somebody else's CDN. A genuine test failure still
  # reds the job, because both steps that run a suite fail hard. The retry and
  # timeout flags come first: a transient failure should self-heal before it is
  # tolerated at all, so tolerance only ever applies to something that survived
  # five attempts.
  #
  # THE SUITE IS SPLIT BY DEPENDENCY so the tolerance reaches as little as
  # possible. It is deliberately not one `discover -s docs_site`.
  # test_gen_catalog.py imports only stdlib plus gen_catalog, which is itself
  # stdlib-only, so it runs UNCONDITIONALLY -- no `if:` on its step. That is not
  # tidiness: the strict roster guarantee described above lives in that module
  # and nowhere else in CI, and while the whole suite sat behind the install
  # gate, an unrelated PyPI outage silently skipped the one test protecting the
  # published site's roster. test_site_content.py is the half that genuinely
  # needs Material -- its 8 BuiltSiteTest cases shell out to a real
  # `mkdocs build --strict` -- and only that half stays gated.
  #
  # Each step names its module with `-p` instead of discovering the directory,
  # so test_gen_catalog.py runs exactly once; a bare `discover -s docs_site` in
  # the second step would re-run all 32 of its cases. The two `-p` patterns must
  # therefore cover docs_site/ between them: 32 + 48 = the 80 that a plain
  # `discover -s docs_site` collects locally. Add a third test module to
  # docs_site/ without adding a step here and it runs in neither.
  #
  # Not `continue-on-error` on the JOB. That would green real test failures too
  # and leave a check that reports nothing -- which is the defect the `roadmap`
  # job's comment below refuses by name, and the reason this job exists at all
  # is that docs_site/'s tests finally execute somewhere.
  #
  # RESIDUAL RISK, stated plainly, and now half the size it was: a *persistent*
  # install failure -- a yanked release, a rename, a pin that no longer resolves
  # -- means test_site_content.py quietly stops running while the job keeps
  # reporting green. What is exposed is that module and only that module:
  # MaterialPinTest, CrewRosterTest, and the 8 end-to-end BuiltSiteTest cases.
  # What is no longer exposed is test_gen_catalog.py, the strict roster
  # assertion included; it runs whatever the install did, which is the point of
  # the split above. The warning annotation and the step-summary line are the
  # only things standing between the remaining gap and nobody noticing, so they
  # are load-bearing, not decoration. If you find yourself trimming CI noise,
  # that annotation is not noise. If you see it on a PR, test_site_content.py
  # did not run on that commit.
  #
  # And if this job is ever added to branch protection, the tolerance must be
  # removed in the same change. A required check that greens itself when its
  # install fails is worse than no check: it converts an outage into a merge
  # gate that certifies nothing while looking like it certified everything.
  docs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same hard pin as .github/workflows/docs.yml, and for the same reason:
      # the custom schemes are coupled to Material's CSS variable names. Keep
      # the two in step.
      - id: install
        continue-on-error: true
        run: pip install --retries 5 --timeout 30 mkdocs-material==9.7.7
      # NO `if:` HERE, DELIBERATELY. test_gen_catalog.py imports stdlib plus
      # gen_catalog, which is itself stdlib-only -- it does not care whether the
      # step above worked. It holds the strict roster guarantee and nothing else
      # does, so it must not be reachable by a PyPI outage.
      - run: python -m unittest discover -s docs_site -p "test_gen_catalog.py" -v
      # `outcome` is the step's result BEFORE continue-on-error rewrites it;
      # `conclusion` would read `success` here no matter what happened, which is
      # exactly the silent-green failure mode being guarded against.
      - if: steps.install.outcome != 'success'
        run: |
          echo "::warning title=docs_site site tests did not run::Installing the pinned mkdocs-material failed after 5 retries. test_site_content.py was SKIPPED on this commit -- MaterialPinTest, CrewRosterTest and the 8 BuiltSiteTest cases did not run. test_gen_catalog.py, including the roster equality assertion, did run and passed. Re-run the job once PyPI is reachable."
          {
            echo "### :warning: \`docs-tests\`: site tests skipped"
            echo
            echo "Installing the pinned \`mkdocs-material\` failed after 5 retries, so"
            echo "\`test_site_content.py\` did **not** run on this commit."
            echo "\`test_gen_catalog.py\` is unaffected -- it needs no install and ran."
            echo "This job is green for the site half because the install broke, not"
            echo "because those tests passed."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.install.outcome == 'success'
        run: python -m unittest discover -s docs_site -p "test_site_content.py" -v

  # `uv.lock` records the project's own version, so it drifts from pyproject.toml
  # on every release. release-please keeps it in step via `extra-files` in
  # release-please-config.json; this job is the tripwire that proves that entry
  # still works. If the project name in pyproject.toml ever changes, the
  # extra-files jsonpath stops matching and silently no-ops -- this check is what
  # turns that silent drift into a loud failure.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv lock --check

  # `ROADMAP.md` duplicates state GitHub owns -- which issues are open, and which
  # milestone each belongs to -- with nothing detecting divergence. It drifted
  # three times over 68 commits: two issues closed but still listed, seven open
  # issues never added (#60). Nothing in the repository fails when that happens,
  # because the drift is caused by issue open/close events on GitHub's side, not
  # by any commit. This job is what turns that silent drift into a loud failure.
  #
  # The offline half of the same check -- the parse, the shape and the
  # duplicate-reference checks, which ARE diff-caused -- already runs on every
  # push and pull request inside the `tests` job, via tests/test_roadmap_drift.py.
  # This job adds only the half that needs the network.
  #
  # TRIGGERS: push-to-main, the weekly cron, and manual dispatch -- NOT
  # `pull_request`. The drift this catches comes from issue open/close events,
  # which produce no PR at all, so a PR run would catch none of it while
  # inheriting all of its false positives. This repo's PRs close issues
  # out-of-band (#89, #91, #93 and #94 use no closing keywords), so every such
  # close would otherwise red the next unrelated PR. The cron is the only trigger
  # that fires on an issue event with no push behind it, and is therefore the
  # highest-value one here.
  #
  # PRECONDITION: this job must NOT be added to main's required status checks.
  # Protection currently requires only ["tests"]. This job exits 2 ("could not
  # check") on a `gh` outage or a rate limit and that is deliberate -- a check
  # that silently disables itself is exactly the defect #60 was filed about -- but
  # it is only safe while a red here does not block merges. If you make it
  # required, change the exit-2 handling first. Do not do both.
  #
  # NOTE: GitHub auto-disables cron workflows after 60 days of repository
  # inactivity. If the weekly run stops appearing, that is why, and
  # `workflow_dispatch` is how it gets re-armed.
  roadmap:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Read-only, and no more. This job never opens a PR or applies a label; it
    # only reports. The script's narrow `--jq` projection is the privacy control
    # that goes with `issues: read`: it pulls number, milestone title and label
    # names and nothing else. This repo is public and so are its CI logs --
    # widening that projection would dump every open issue body into one.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Exit 1 (drift) and exit 2 (could not check) both fail this job on
      # purpose. Do not soften either with an error-swallowing step option --
      # a check that goes quiet is the defect, not the cure.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/check_roadmap_drift.py
