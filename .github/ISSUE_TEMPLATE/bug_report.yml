name: Bug report
description: Something in the framework isn't working as expected
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bugs are fixed and shipped normally. They do **not** get a line on
        `ROADMAP.md` — that file lists planned capabilities, not the backlog.
        See [What goes on the roadmap](https://github.com/noctua84/nescio-ai/blob/main/CONTRIBUTING.md#what-goes-on-the-roadmap).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that reproduces it.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in each line. "unknown" is an acceptable answer.
      value: |
        - OS:
        - Claude Code version:
        - NescioAI commit:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / notes
      description: >
        Command output, tracebacks, anything else relevant. Scrub machine names,
        paths, and tokens before pasting — this repository is public.
    validations:
      required: false
